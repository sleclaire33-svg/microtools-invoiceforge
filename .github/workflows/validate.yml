name: Validate
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          for f in api/*.js netlify/functions/*.js; do node --check "$f"; done
      - name: Verify Netlify public copy
        run: |
          cmp -s index.html public/index.html
          cmp -s app.js public/app.js
          cmp -s styles.css public/styles.css
          cmp -s privacy.html public/privacy.html
          cmp -s terms.html public/terms.html
          cmp -s refunds.html public/refunds.html
      - name: Verify launch SEO files
        run: |
          test -s public/robots.txt
          test -s public/sitemap.xml
          grep -q "https://invoiceforge.netlify.app/sitemap.xml" public/robots.txt
          grep -q "https://invoiceforge.netlify.app/" public/sitemap.xml
